<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lipstick Mirror Canvas</title>
  <!-- Simple, reliable hand tracking library -->
  <script src="https://cdn.jsdelivr.net/npm/handtrackjs@1.0.0/dist/handtrack.min.js"></script>
  <style>
    body { margin: 0; background: #fff0f3; overflow: hidden; font-family: sans-serif; }
    #canvas { width: 100vw; height: 100vh; display: block; background: #fce4ec; }
    #status { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 20px; border-radius: 20px; color: #ff4d6d; font-weight: bold; border: 1px solid #ffccd5; z-index: 10; }
    #clearBtn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff4d6d; color: white; border: none; padding: 12px 24px; border-radius: 20px; cursor: pointer; z-index: 10; font-weight: bold; }
  </style>
</head>
<body>

  <div id="status">Starting tracking...</div>
  <video id="webcam" style="display:none;"></video>
  <canvas id="canvas"></canvas>
  <button id="clearBtn">Clear Mirror</button>

  <script>
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const clearBtn = document.getElementById("clearBtn");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let lastX = null, lastY = null;
    let model = null;

    // Load model options
    const modelParams = {
      flipHorizontal: true,   // mirror image for natural writing
      maxNumBoxes: 1,
      iouThreshold: 0.5,
      scoreThreshold: 0.6,
    };

    // Load Handtrack Model
    handtrack.load(modelParams).then(lmodel => {
      model = lmodel;
      statusEl.innerText = "Model loaded! Starting webcam...";
      handtrack.startVideo(video).then(status => {
        if (status) {
          statusEl.innerText = "✨ Move your hand in front of camera to write ✨";
          runDetection();
        } else {
          statusEl.innerText = "❌ Please enable camera permissions.";
        }
      });
    });

    function runDetection() {
      model.detect(video).then(predictions => {
        if (predictions.length > 0) {
          // Track center of detected hand
          const bbox = predictions[0].bbox;
          const x = (bbox[0] + bbox[2] / 2) * (canvas.width / video.width);
          const y = (bbox[1] + bbox[3] / 2) * (canvas.height / video.height);

          if (lastX !== null && lastY !== null) {
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);

            // Glossy Lipstick Styling
            ctx.strokeStyle = "rgba(214, 28, 78, 0.8)";
            ctx.lineWidth = 20;
            ctx.lineCap = "round";
            ctx.shadowColor = "#ff758f";
            ctx.shadowBlur = 8;
            ctx.stroke();
          }
          lastX = x;
          lastY = y;
        } else {
          lastX = null;
          lastY = null;
        }
        requestAnimationFrame(runDetection);
      });
    }

    clearBtn.addEventListener("click", () => ctx.clearRect(0, 0, canvas.width, canvas.height));
  </script>
</body>
</html>
